name: Bootstrap QR attendance

on:
  push:
    branches:
      - qr-attendance-feedback
    paths:
      - .github/workflows/bootstrap-qr-attendance.yml

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qr-attendance-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add QR dependencies
        run: |
          npm install --save-exact qrcode@1.5.4
          npm install --save-dev --save-exact @types/qrcode@1.5.6
      - name: Create migration through Supabase CLI
        run: npx supabase migration new qr_attendance_feedback
      - name: Commit bootstrap changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json supabase/migrations
          git commit -m "Bootstrap QR attendance dependencies and migration"
          git push origin HEAD:qr-attendance-feedback
