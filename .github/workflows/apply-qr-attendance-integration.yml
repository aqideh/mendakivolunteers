name: Apply QR attendance integration

on:
  push:
    branches:
      - qr-attendance-feedback
    paths:
      - .github/workflows/apply-qr-attendance-integration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qr-attendance-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/apply-qr-attendance-integration.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/events/[id]/attendance/page.tsx src/app/admin/events/[id]/report/export/route.ts src/app/checkin.css
          git commit -m "Integrate QR attendance into event operations"
          git push origin HEAD:qr-attendance-feedback
