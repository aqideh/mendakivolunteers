name: Apply attendance operations navigation

on:
  push:
    branches:
      - attendance-monitor-reconciliation
    paths:
      - .github/workflows/apply-attendance-ops-navigation.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attendance-monitor-reconciliation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node .github/scripts/patch-attendance-ops-navigation.mjs
      - name: Remove temporary patch files
        run: git rm .github/scripts/patch-attendance-ops-navigation.mjs .github/workflows/apply-attendance-ops-navigation.yml
      - name: Commit navigation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/events/[id]/attendance/page.tsx src/app/admin/events/[id]/edit/page.tsx .github
          git commit -m "Link attendance monitor and reconciliation views"
          git push origin HEAD:attendance-monitor-reconciliation
