name: Apply roster dietary patch

on:
  push:
    branches:
      - roster-dietary-requirements
    paths:
      - .github/scripts/apply-roster-dietary-patch.mjs
      - .github/workflows/apply-roster-dietary-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: roster-dietary-requirements
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node .github/scripts/apply-roster-dietary-patch.mjs
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/apply-roster-dietary-patch.mjs
          rm .github/workflows/apply-roster-dietary-patch.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add roster dietary requirements"
          git push origin HEAD:roster-dietary-requirements
