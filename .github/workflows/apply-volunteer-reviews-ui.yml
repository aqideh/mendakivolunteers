name: Apply volunteer reviews UI

on:
  push:
    branches:
      - volunteer-reviews-and-walkin-edit

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: volunteer-reviews-and-walkin-edit

      - name: Apply UI patch
        run: python3 scripts/apply-volunteer-reviews-ui.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/events/'[id]'/attendance/page.tsx src/app/admin/events/'[id]'/insights/page.tsx src/app/volunteer-insights.css
          if git diff --cached --quiet; then
            echo "No UI changes to commit"
          else
            git commit -m "Integrate volunteer reviews into event operations"
            git push origin HEAD:volunteer-reviews-and-walkin-edit
          fi
