name: Repair dependency audit lockfile

on:
  push:
    branches:
      - agent/hide-pathways-navigation

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/hide-pathways-navigation

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh vulnerable transitive dependencies
        run: npm update nanoid js-yaml --package-lock-only

      - name: Verify patched versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const nanoid = lock.packages?.['node_modules/nanoid']?.version;
          const jsYaml = lock.packages?.['node_modules/js-yaml']?.version;
          console.log({ nanoid, jsYaml });
          if (nanoid !== '3.3.17') throw new Error(`Expected nanoid 3.3.17, got ${nanoid}`);
          if (jsYaml !== '4.3.1') throw new Error(`Expected js-yaml 4.3.1, got ${jsYaml}`);
          NODE

      - name: Verify dependency audits
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile change required."
            exit 0
          fi
          git commit -m "Fix dependency audit vulnerabilities"
          git push origin HEAD:agent/hide-pathways-navigation
