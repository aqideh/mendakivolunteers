name: Refresh security lockfile

on:
  push:
    branches:
      - volunteer-insights-mvp

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: volunteer-insights-mvp

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin patched dependencies
        run: |
          npm pkg set dependencies.next=16.3.4
          npm pkg set dependencies.sharp=0.35.4
          npm pkg set devDependencies.eslint-config-next=16.3.4
          npm pkg set overrides.sharp=0.35.4

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Commit patched manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency manifest changes to commit."
          else
            git commit -m "Patch Next.js and Sharp security vulnerabilities"
            git push origin HEAD:volunteer-insights-mvp
          fi
