name: Refresh security lockfile

on:
  push:
    branches:
      - volunteer-insights-mvp

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin patched dependencies
        run: |
          npm pkg set dependencies.next=16.3.4
          npm pkg set dependencies.sharp=0.35.4
          npm pkg set devDependencies.eslint-config-next=16.3.4
          npm pkg set overrides.sharp=0.35.4

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify production audit
        run: npm audit --omit=dev --audit-level=high

      - name: Upload patched manifests
        uses: actions/upload-artifact@v7
        with:
          name: patched-dependency-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
