name: Apply inline volunteer insights

on:
  push:
    branches:
      - attendance-inline-insights

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: attendance-inline-insights

      - name: Apply patch
        run: python3 scripts/apply-inline-insights.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/app/admin/events/[id]/attendance/page.tsx" "src/app/admin/events/[id]/insights/actions.ts" src/app/volunteer-insights.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add inline volunteer insights to attendance roster"
            git push origin HEAD:attendance-inline-insights
          fi
